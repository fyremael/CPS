model:
  run: polypythia-70m-seed1
  revision: step1000
  device: auto
  dtype: float32
  cache_dir: /content/.cache/huggingface
  attention_implementation: eager
data:
  source: builtin
  sequence_length: 32
  batch_size: 1
state:
  moment_source: reconstructed
  step: 1000
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-08
  learning_rate: 0.0006
  weight_decay: 0.01
basis:
  parameter_patterns:
  - gpt_neox.layers.0.attention.dense.weight
  max_selected_numel: 1000000
  components:
  - theta
  - update
  - random
  random_vectors_per_block: 2
  rank: 4
  seed: 23
jacobian:
  mode: finite_difference
  autodiff_backend: auto
  fallback_to_finite_difference: true
sweep:
  phase_count: 33
  finite_horizon: 12
  compute_kreiss: false
  maximum_couplings: 8
output:
  root: /content/cps-artifacts
  run_name: polypythia-70m-seeds
  verbose: true
