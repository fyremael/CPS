model:
  run: pythia-70m
  revision: step0
  device: auto
  dtype: float32
  cache_dir: /content/.cache/huggingface

data:
  source: builtin
  sequence_length: 32
  batch_size: 1
  seed: 17

state:
  moment_source: reconstructed
  step: 1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  learning_rate: 6.0e-4
  weight_decay: 0.01
  v_floor: 1.0e-12

basis:
  parameter_patterns:
    - gpt_neox.layers.0.attention.dense.weight
  max_selected_numel: 1000000
  components: [theta, update, random]
  random_vectors_per_block: 2
  rank: 4
  seed: 23
  orthogonalization_tolerance: 1.0e-7

jacobian:
  mode: autodiff
  finite_difference_relative_step: 1.0e-4
  finite_difference_absolute_floor: 1.0e-6

sweep:
  phase_count: 33
  finite_horizon: 12
  compute_kreiss: false
  maximum_couplings: 8

output:
  root: /content/cps-artifacts
  run_name: pythia-70m-smoke
