[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coupling-phase-spectroscopy"
version = "0.2.7"
description = "Structured pseudospectral diagnostics for projected optimizer-state Jacobians"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Grand Challenge Labs"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pythia = [
  "torch>=2.1",
  "transformers>=4.37",
  "huggingface-hub>=0.20",
  "safetensors>=0.4",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.25",
  "pandas>=2.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.2",
  "build>=1.0",
]

[project.scripts]
cps = "cps.cli:main"
cps-pythia = "cps.pythia.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
