[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coupling-phase-spectroscopy"
version = "0.2.8"
description = "Structured pseudospectral diagnostics for projected optimizer-state Jacobians"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Grand Challenge Labs"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
pythia = [
  "torch>=2.1",
  "transformers>=4.45",
  "huggingface-hub>=0.25",
  "safetensors>=0.4",
  "accelerate>=0.33",
  "datasets>=2.20",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
]
notebooks = ["nbformat>=5.10", "jupyter>=1.0"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "nbformat>=5.10",
]

[project.scripts]
cps-analyze = "cps.cli:main"
cps-pythia = "cps.pythia.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: network or accelerator dependent tests",
  "slow: tests unsuitable for the default CI lane",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
