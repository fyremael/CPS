name: Apply CPS notebook revamp

on:
  push:
    branches: [fix/verbose-notebooks-forward-ad]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verbose-notebooks-forward-ad
          fetch-depth: 0

      - name: Reconstruct and verify payload
        run: |
          cat .cps-revamp/chunk* > /tmp/cps-revamp.tar.gz.b64
          echo "92b4c01bc3ee9f9d02d588817a145b5434d9fab491e60da70f3c1b8a7b936d9f  /tmp/cps-revamp.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/cps-revamp.tar.gz.b64 | tar --extract --gzip

      - name: Validate generated notebooks and Python syntax
        run: |
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests

      - name: Remove transfer scaffold
        run: |
          rm -rf .cps-revamp
          rm -f .github/workflows/apply-revamp.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix forward-AD compatibility and revamp Colab pedagogy"
          git push origin HEAD:fix/verbose-notebooks-forward-ad
