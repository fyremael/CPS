name: Apply native parameter name alignment on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply alignment integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-native-name-alignment.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n      - name: Install and validate"
          block = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(block), '<native-name-alignment-patch>', 'exec'))
          PY
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas
          pytest -q
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
          python -m build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cps/pythia/native_state_stable.py src/cps/pythia/native_name_alignment.py src/cps/pythia/runner.py tests/pythia/test_native_name_alignment.py notebooks/04_native_optimizer_state.ipynb pyproject.toml
          git commit -m 'Align native GPT-NeoX parameter names with Transformers'
          git push origin HEAD:${{ github.head_ref }}
