name: Commit native optimizer-group patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-native-group-inference.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n      - name: Install"
          block = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(block), '<native-group-patch>', 'exec'))
          PY
      - name: Commit and push
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cps/pythia/native_state.py src/cps/pythia/runner.py tests/pythia/test_native_state.py notebooks/04_native_optimizer_state.ipynb pyproject.toml
          git diff --cached --stat
          git commit -m 'Infer Pythia optimizer decay groups from native moment capacities'
          git push origin HEAD:${{ github.head_ref }}
