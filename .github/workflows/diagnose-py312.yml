name: Diagnose Python 3.12 tests

on:
  push:
    branches: [fix/verbose-notebooks-forward-ad]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/verbose-notebooks-forward-ad
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas
      - name: Capture pytest output
        run: |
          set +e
          pytest -q > /tmp/pytest-3.12.log 2>&1
          status=$?
          set -e
          mkdir -p artifacts/ci
          {
            echo "exit_status=$status"
            cat /tmp/pytest-3.12.log
          } > artifacts/ci/pytest-3.12.log
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ci/pytest-3.12.log
          git commit -m "chore: capture Python 3.12 test failure"
          git push origin HEAD:fix/verbose-notebooks-forward-ad
