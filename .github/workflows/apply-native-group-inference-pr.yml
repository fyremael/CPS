name: Apply native optimizer-group inference on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply implementation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-native-group-inference.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install"
          block = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(block), '<native-group-patch>', 'exec'))
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas
      - name: Validate
        run: |
          pytest -q
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
          python -m pip install build
          python -m build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cps/pythia/native_state.py src/cps/pythia/runner.py tests/pythia/test_native_state.py notebooks/04_native_optimizer_state.ipynb pyproject.toml
          git commit -m 'Infer Pythia optimizer decay groups from native moment capacities'
          git push origin HEAD:${{ github.head_ref }}
