name: Apply native metadata reconciliation

on:
  push:
    branches: [fix/native-metadata-capacity-reconciliation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-metadata-capacity-reconciliation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reconciliation fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          grouped_path = Path('src/cps/pythia/native_state_grouped.py')
          text = grouped_path.read_text()
          old = '''    if param_groups is None:\n        param_groups = legacy._find_param_shapes(optimizer_payloads)\n        shape_source = "optimizer_checkpoint_param_shapes"\n\n    if param_groups is None:\n        caller_groups = legacy._caller_shape_groups(parameter_shapes)\n'''
          new = '''    if param_groups is None:\n        param_groups = legacy._find_param_shapes(optimizer_payloads)\n        shape_source = "optimizer_checkpoint_param_shapes"\n\n    # A historical packet can publish a complete one-group param_shapes mapping\n    # while exposing only a filtered Adam moment group. Reconcile every\n    # checkpoint-authored shape contract against the observed moment capacities,\n    # not only the caller-supplied fallback contract. The packet compatibility\n    # layer installs the single-group decay/no-decay classifier used here.\n    if param_groups is not None:\n        param_groups, metadata_group_report = _infer_optimizer_shape_groups(\n            param_groups,\n            avg_capacities,\n            partition_count=len(optimizer_files),\n        )\n        if metadata_group_report is not None:\n            shape_source = f"{shape_source}_reconciled_with_native_moment_capacity"\n            validation = {\n                "method": "checkpoint_metadata_plus_optimizer_group_capacities",\n                "validated": True,\n                "optimizer_groups": metadata_group_report,\n            }\n\n    if param_groups is None:\n        caller_groups = legacy._caller_shape_groups(parameter_shapes)\n'''
          if old not in text:
              raise SystemExit('native_state_grouped metadata anchor not found')
          grouped_path.write_text(text.replace(old, new, 1))

          runner_path = Path('src/cps/pythia/runner.py')
          runner = runner_path.read_text()
          old_runner = '''        if native.shape_validation.get("match_fraction") is not None:\n            reporter.metric(\n                "native order signature match",\n                f"{native.shape_validation['match_fraction']:.1%}",\n            )\n'''
          new_runner = '''        if native.shape_validation.get("match_fraction") is not None:\n            reporter.metric(\n                "native order signature match",\n                f"{native.shape_validation['match_fraction']:.1%}",\n            )\n        group_validation = native.shape_validation.get("optimizer_groups")\n        if group_validation is not None:\n            reporter.metric(\n                "native moment coverage",\n                group_validation.get("coverage", group_validation.get("order", "unknown")),\n            )\n            reporter.info(\n                "Native group contract: "\n                f"expected={group_validation.get('expected_group_numel')}; "\n                f"observed={group_validation.get('observed_group_numel')}; "\n                f"padding={group_validation.get('padding_numel')}"\n            )\n            if group_validation.get("partial_native_state"):\n                reporter.warning(\n                    "The released packet exposes a partial native optimizer state; "\n                    f"unavailable={group_validation.get('unavailable_parameter_class')} "\n                    f"({group_validation.get('unavailable_parameter_numel')} parameters)."\n                )\n'''
          if old_runner not in runner:
              raise SystemExit('runner native validation reporting anchor not found')
          runner_path.write_text(runner.replace(old_runner, new_runner, 1))

          test_path = Path('tests/pythia/test_native_metadata_partial_group.py')
          test_path.write_text('''from collections import OrderedDict\n\nimport pytest\nimport torch\n\nfrom cps.pythia.native_state_packet import reconstruct_zero_adam_state\n\n\ndef _save_packet(tmp_path):\n    shapes = OrderedDict(\n        [\n            ("gpt_neox.layers.0.attention.dense.weight", (2, 3)),\n            ("gpt_neox.layers.0.attention.dense.bias", (2,)),\n            ("gpt_neox.layers.0.input_layernorm.weight", (2,)),\n        ]\n    )\n    torch.save(\n        {"iteration": 143000, "param_shapes": [shapes]},\n        tmp_path / "mp_rank_00_model_states.pt",\n    )\n\n    full_weight = torch.tensor(\n        [0.5, -1.0, 2.0, 3.0, -4.0, 1.5, 0.25, -0.5, 1.25, -1.5]\n    )\n    decay_m = torch.arange(1.0, 7.0)\n    decay_v = decay_m.square()\n    for rank in range(2):\n        full_slice = slice(rank * 5, (rank + 1) * 5)\n        decay_slice = slice(rank * 3, (rank + 1) * 3)\n        payload = {\n            "optimizer_state_dict": {\n                "single_partition_of_fp32_groups": [\n                    full_weight[full_slice].clone()\n                ],\n                "optimizer_state_dict": {\n                    "state": {\n                        0: {\n                            "exp_avg": [decay_m[decay_slice].clone()],\n                            "exp_avg_sq": [decay_v[decay_slice].clone()],\n                        }\n                    }\n                },\n            }\n        }\n        torch.save(\n            payload,\n            tmp_path / f"zero_pp_rank_{rank}_mp_rank_00_optim_states.pt",\n        )\n    return decay_m\n\n\ndef test_reconciles_checkpoint_param_shapes_with_decay_only_moments(tmp_path):\n    decay_m = _save_packet(tmp_path)\n    target = "gpt_neox.layers.0.attention.dense.weight"\n\n    state = reconstruct_zero_adam_state(tmp_path, parameter_names=[target])\n\n    assert (\n        state.shape_source\n        == "model_checkpoint_param_shapes_reconciled_with_native_moment_capacity"\n    )\n    report = state.shape_validation["optimizer_groups"]\n    assert report["coverage"] == "weight_decay_only"\n    assert report["expected_group_numel"] == [6]\n    assert report["observed_group_numel"] == [6]\n    assert report["unavailable_parameter_numel"] == 4\n    assert torch.equal(state.exp_avg[target], decay_m.reshape(2, 3))\n\n\ndef test_metadata_partial_packet_fails_closed_for_unavailable_parameter(tmp_path):\n    _save_packet(tmp_path)\n\n    with pytest.raises(KeyError, match="requested parameters absent from native state"):\n        reconstruct_zero_adam_state(\n            tmp_path,\n            parameter_names=["gpt_neox.layers.0.attention.dense.bias"],\n        )\n''')

          notebook_path = Path('notebooks/04_native_optimizer_state.ipynb')
          notebook = json.loads(notebook_path.read_text())
          for cell in notebook['cells']:
              if cell.get('id') == '0c8e3273-md':
                  cell['source'] = [
                      '## Stage 2 — bind and validate the native moments\n',
                      '\n',
                      'The optimizer step number is derived from the semantic checkpoint revision. Historical GPT-NeoX packets vary in metadata and optimizer-state layout. CPS now reconciles **every** discovered `param_shapes` contract—checkpoint-authored or model-derived—against the observed Adam moment capacities before reconstruction. This matters because the released 70M packet can provide a complete model shape list while exposing only the matrix/embedding weight-decay moments. The execution cell prints the active packet-aware reader and the resulting coverage contract.\n',
                  ]
          notebook_path.write_text(json.dumps(notebook, indent=1) + '\n')

          pyproject = Path('pyproject.toml')
          project = pyproject.read_text()
          if 'version = "0.2.9"' not in project:
              raise SystemExit('expected project version 0.2.9')
          pyproject.write_text(project.replace('version = "0.2.9"', 'version = "0.2.10"', 1))

          for accidental in [
              Path('diagnostics/native-metadata-reconcile-design.md'),
              Path('diagnostics/native-metadata-reconcile-design-2.md'),
              Path('diagnostics/do-not-use.md'),
          ]:
              accidental.unlink(missing_ok=True)
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile checkpoint metadata with native moment capacities'
          git push origin HEAD:fix/native-metadata-capacity-reconciliation
      - name: Validate focused path
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,notebooks]'
          python -m pip install -q torch pandas --index-url https://download.pytorch.org/whl/cpu
          pytest -q tests/pythia/test_native_metadata_partial_group.py tests/pythia/test_native_single_moment_group.py tests/pythia/test_native_reader_binding.py
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
