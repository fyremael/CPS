name: Validate release-grade notebook pass

on:
  push:
    branches: [release/colab-notebook-pedagogy]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/colab-notebook-pedagogy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and commit notebook syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/05_cps_planning.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          repaired = False
          for cell in notebook['cells']:
              if cell.get('cell_type') != 'code':
                  continue
              source = ''.join(cell.get('source', []))
              marker = 'print(f"[PLAN] shape={A.shape}; ||A||₂={__import__("numpy").linalg.norm(A, 2):.6g}", flush=True)'
              if marker in source:
                  source = source.replace('import os\n', 'import os\nimport numpy as np\n', 1)
                  source = source.replace(
                      marker,
                      'print(f"[PLAN] shape={A.shape}; ||A||₂={np.linalg.norm(A, 2):.6g}", flush=True)',
                  )
                  cell['source'] = source.splitlines(keepends=True)
                  repaired = True
          if not repaired:
              raise SystemExit('expected planning-notebook syntax marker was not found')
          path.write_text(json.dumps(notebook, indent=1) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/05_cps_planning.ipynb
          git commit -m 'Repair self-contained planning notebook syntax'
          git push origin HEAD:release/colab-notebook-pedagogy
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas
          pytest -q
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
          python -m build
