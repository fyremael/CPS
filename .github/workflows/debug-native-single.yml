name: Debug native packet tests

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quietly
        run: |
          python -m pip install -q -e '.[dev]'
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Focused tests
        run: pytest -vv tests/pythia/test_native_single_moment_group.py tests/pythia/test_native_state.py
