name: Repair notebook tone polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair stage rendering, theme order, and style tests
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          module = Path('src/cps/notebook.py')
          text = module.read_text(encoding='utf-8')
          replacement = '''def stage_banner(
    stage: str,
    title: str,
    *,
    objective: str,
    deliverable: str,
) -> None:
    """Render a uniform Grand Challenge stage boundary."""

    _display_html(
        '<section class="cps-stage">'
        f'<div class="cps-stage__index">Stage {html.escape(str(stage))}</div>'
        f'<div class="cps-stage__title">{html.escape(title)}</div>'
        '<div class="cps-stage__grid">'
        '<div class="cps-stage__label">Objective</div>'
        f'<div class="cps-stage__value">{html.escape(objective)}</div>'
        '<div class="cps-stage__label">Evidence produced</div>'
        f'<div class="cps-stage__value">{html.escape(deliverable)}</div>'
        '</div></section>'
    )


'''
          pattern = re.compile(r'def stage_banner\(.*?\n\n\ndef show_environment', re.DOTALL)
          if pattern.search(text) is None:
              raise SystemExit('stage_banner function anchor not found')
          text = pattern.sub(replacement + 'def show_environment', text, count=1)
          module.write_text(text, encoding='utf-8')

          for path in sorted(Path('notebooks').glob('*.ipynb')):
              notebook = json.loads(path.read_text(encoding='utf-8'))
              changed = False
              for cell in notebook['cells']:
                  if cell.get('cell_type') != 'code':
                      continue
                  source = ''.join(cell.get('source', []))
                  if 'apply_release_theme' not in source or 'show_environment' not in source:
                      continue
                  source = source.replace(
                      'from cps.notebook import apply_release_theme, stage_banner\nstage_banner(',
                      'from cps.notebook import apply_release_theme, stage_banner\napply_release_theme()\nstage_banner(',
                      1,
                  )
                  source = source.replace(
                      'from cps.notebook import show_environment\napply_release_theme()\n',
                      'from cps.notebook import show_environment\n',
                      1,
                  )
                  cell['source'] = source.splitlines(keepends=True)
                  changed = True
                  break
              if not changed:
                  raise SystemExit(f'release theme cell not found in {path}')
              path.write_text(json.dumps(notebook, indent=1) + '\n', encoding='utf-8')

          tests = Path('tests/test_notebook_release_style.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'assert "Grand Challenge release notebook" in text',
              'assert "Grand Challenge Labs · Coupling-Phase Spectroscopy" in text',
          )
          if 'test_theme_is_applied_before_first_stage_card' not in test_text:
              test_text += '''\n\ndef test_theme_is_applied_before_first_stage_card():\n    for path in sorted(Path("notebooks").glob("*.ipynb")):\n        notebook = nbformat.read(path, as_version=4)\n        source = "\\n".join(cell.source for cell in notebook.cells if cell.cell_type == "code")\n        assert source.index("apply_release_theme()") < source.index("stage_banner(")\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cps/notebook.py notebooks tests/test_notebook_release_style.py
          git commit -m 'Repair release theme rendering and initialization order'
          git push origin HEAD:${{ github.head_ref }}
      - name: Validate polished suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas
          pytest -q
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
          python -m build
