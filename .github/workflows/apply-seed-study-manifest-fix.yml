name: Apply seed-study manifest fix

on:
  push:
    branches: [fix/seed-study-manifest-key]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seed-study-manifest-key
          fetch-depth: 0

      - name: Add governed manifest identity helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cps/notebook.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\n\ndef display_probe_summary(root: str | Path, *, top_n: int = 8) -> dict[str, Any]:\n'
          helper = '''\n\ndef manifest_run_identity(manifest: dict[str, Any]) -> dict[str, Any]:
    """Resolve a stable run identity across current and legacy evidence manifests.

    Schema-v2 manifests store the registry identifier in ``run_spec.key``.  Older
    or external packets may expose ``run_spec.name`` or only the configured model
    run.  Notebook presentation should tolerate those variants without changing
    the immutable evidence packet.
    """

    run_spec = manifest.get("run_spec") or {}
    config = manifest.get("config") or {}
    model_config = config.get("model") or {}
    key = (
        run_spec.get("key")
        or run_spec.get("name")
        or model_config.get("run")
        or manifest.get("model_id")
        or "unknown"
    )
    return {
        "key": str(key),
        "family": str(run_spec.get("family") or "unknown"),
        "seed": run_spec.get("seed"),
    }
'''
          if 'def manifest_run_identity(' not in text:
              if anchor not in text:
                  raise RuntimeError('display_probe_summary anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Repair notebook 03 aggregation cell
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/03_polypythia_seed_study.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          target = next(
              cell for cell in notebook['cells']
              if cell.get('cell_type') == 'code'
              and 'manifest["run_spec"]["name"]' in ''.join(cell.get('source', []))
          )
          source = '''import json, pathlib, pandas as pd
from IPython.display import display
from cps.notebook import manifest_run_identity


def metric_max(records, metric):
    """Return a run-level maximum while keeping empty evidence packets visible."""
    return max(
        (record["metrics"][metric] for record in records),
        default=float("nan"),
    )


rows = []
for output in outputs:
    root = pathlib.Path(output)
    manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
    records = json.loads((root / "couplings.json").read_text(encoding="utf-8"))
    identity = manifest_run_identity(manifest)
    if not records:
        print(f"[SEEDS] warning: no coupling records in {root}", flush=True)
    rows.append({
        "run": identity["key"],
        "seed": identity["seed"],
        "family": identity["family"],
        "revision": manifest.get("revision", "unknown"),
        "JVP backend": manifest.get("jacobian", {}).get("effective_backend", "unknown"),
        "closure max": manifest.get("projection", {}).get(
            "maximum_closure_residual", float("nan")
        ),
        "phase radius max": metric_max(records, "spectral_radius_max"),
        "transient gain max": metric_max(records, "finite_horizon_gain"),
    })

seed_frame = pd.DataFrame(rows)
display(seed_frame)
print(
    "[SEEDS] Run identity is read from run_spec.key; exact manifests remain unchanged.",
    flush=True,
)
print("[SEEDS] Do not interpret two points as a variance estimate.", flush=True)
'''
          target['source'] = source.splitlines(keepends=True)

          markdown = next(
              cell for cell in notebook['cells']
              if cell.get('cell_type') == 'markdown'
              and 'This table is descriptive.' in ''.join(cell.get('source', []))
          )
          body = ''.join(markdown['source'])
          note = (
              '\n\nThe run identifier is the registry key stored in `manifest.run_spec.key`. '
              'The reader remains compatible with older packets that used `name`, but new '
              'evidence must follow the documented schema. Empty coupling sets are reported '
              'as `NaN` rather than crashing the comparison cell.'
          )
          if note.strip() not in body:
              markdown['source'] = (body.rstrip() + note + '\n').splitlines(keepends=True)

          path.write_text(json.dumps(notebook, indent=1) + '\n', encoding='utf-8')
          PY

      - name: Add regression coverage and schema clarification
        run: |
          cat > tests/test_manifest_identity.py <<'PY'
          import json
          from pathlib import Path

          from cps.notebook import manifest_run_identity


          def test_manifest_run_identity_uses_schema_v2_registry_key():
              identity = manifest_run_identity(
                  {"run_spec": {"key": "polypythia-70m-seed2", "family": "polypythia", "seed": 2}}
              )
              assert identity == {
                  "key": "polypythia-70m-seed2",
                  "family": "polypythia",
                  "seed": 2,
              }


          def test_manifest_run_identity_supports_legacy_name_and_config_fallback():
              assert manifest_run_identity({"run_spec": {"name": "legacy-run"}})["key"] == "legacy-run"
              assert (
                  manifest_run_identity({"config": {"model": {"run": "configured-run"}}})["key"]
                  == "configured-run"
              )


          def test_seed_study_notebook_does_not_require_run_spec_name():
              notebook = json.loads(
                  Path('notebooks/03_polypythia_seed_study.ipynb').read_text(encoding='utf-8')
              )
              source = '\n'.join(
                  ''.join(cell.get('source', [])) for cell in notebook.get('cells', [])
              )
              assert 'manifest["run_spec"]["name"]' not in source
              assert 'manifest_run_identity' in source
              assert 'default=float("nan")' in source
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/RESULT_SCHEMA.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- `subject`, `run_spec`, `model_id`, `revision`;\n'
          replacement = (
              '- `subject`, `run_spec`, `model_id`, `revision`;\n'
              '- `run_spec.key` is the stable registry identifier; optional `family`, `seed`, '
              '`weight_seed`, and `data_seed` fields describe the run;\n'
          )
          if replacement not in text:
              if anchor not in text:
                  raise RuntimeError('schema anchor not found')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text, encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('version = "0.2.3"', 'version = "0.2.4"', 1)
          pyproject.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,notebooks]'
          pytest -q
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests

      - name: Commit implementation
        run: |
          rm -f .github/workflows/apply-seed-study-manifest-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PolyPythia seed-study manifest identity lookup"
          git push origin HEAD:fix/seed-study-manifest-key
