name: Capture native packet failure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quietly
        run: |
          python -m pip install -q -e '.[dev]'
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run and capture
        id: tests
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          pytest -vv tests/pythia/test_native_single_moment_group.py tests/pythia/test_native_state.py > diagnostics/native-single-tests.txt 2>&1
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/native-single-tests.txt
          git commit -m 'Record focused native packet test output'
          git push origin HEAD:${{ github.head_ref }}
      - name: Preserve status
        if: steps.tests.outcome == 'failure'
        run: exit 1
