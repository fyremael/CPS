name: Capture native reader reload diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -q -e '.[dev,notebooks]'
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pandas
      - name: Capture tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          pytest -vv > diagnostics/native-reader-reload-tests.txt 2>&1
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/native-reader-reload-tests.txt
          git commit -m 'Record native reader reload test diagnostics'
          git push origin HEAD:${{ github.head_ref }}
      - name: Preserve result
        if: steps.tests.outcome == 'failure'
        run: exit 1
