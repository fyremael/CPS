name: Capture native reader binding diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -q -e '.[dev,notebooks]'
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Capture validation
        id: validation
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          {
            echo '=== TESTS ==='
            pytest -vv
            echo '=== NOTEBOOKS ==='
            python scripts/validate_notebooks.py
            echo '=== COMPILE ==='
            python -m compileall -q src scripts tests
          } > diagnostics/native-reader-binding.txt 2>&1
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/native-reader-binding.txt
          git commit -m 'Record native reader binding validation'
          git push origin HEAD:${{ github.head_ref }}
      - name: Preserve status
        if: steps.validation.outcome == 'failure'
        run: exit 1
