name: Apply native shape fallback patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_native_shape_fallback_patch.py

      - name: Validate
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,notebooks]'
          pytest -q 2>&1 | tee /tmp/pytest.log
          python scripts/validate_notebooks.py
          python -m compileall -q src scripts tests
          python -m pip install -q build
          python -m build -n

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate native Pythia model-order reconstruction"
          git push origin HEAD:${{ github.head_ref }}
